services:
  backend:
    container_name: leaf-plate-backend
    build:
      context: ./back-end
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./back-end:/app
      - ./back-end/.env.local:/app/.env.local:ro
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped

  frontend:
    container_name: leaf-plate-frontend
    build:
      context: ./front-end
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./front-end:/app
      - ./front-end/.env.local:/app/.env.local:ro
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev
    restart: unless-stopped
